name: Refresh site data
on:
  schedule:
    - cron: "41 3 * * *"
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-data
  cancel-in-progress: true
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild data/, the updates feed and the home page's latest line
        run: python3 scripts/update_data.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          git config user.name "tarilka0gg"
          git config user.email "216761460+tarilka0gg@users.noreply.github.com"
          git add data updates/index.html index.html
          git diff --cached --quiet || { git commit -m "Refresh site data" && git push; }
